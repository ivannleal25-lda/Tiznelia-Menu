<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Tiznelia by BUCA | Carta</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#11100f;color:#f4efe5;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh}
header{text-align:center;padding:42px 20px 28px;border-bottom:1px solid #3a342d}
.brand{font-size:34px;letter-spacing:5px;font-weight:700}
.by{font-family:Arial,sans-serif;font-size:12px;letter-spacing:4px;margin-top:7px;color:#c9b99a}
.tag{font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;margin-top:18px;color:#9e917d}
main{max-width:520px;margin:auto;padding:30px 20px 50px}
h1{text-align:center;font-size:24px;font-weight:400;letter-spacing:3px;margin:10px 0 28px}
.buttons{display:grid;gap:14px}
a.button{display:block;text-decoration:none;color:#f4efe5;border:1px solid #6e604c;border-radius:3px;padding:22px 18px;text-align:center;background:#181614;font-family:Arial,sans-serif;font-size:14px;letter-spacing:3px;transition:.2s}
a.button:active{transform:scale(.99);background:#25211c}
.note{text-align:center;color:#8f877c;font:12px Arial,sans-serif;line-height:1.6;margin-top:28px}
.viewer{display:none;position:fixed;inset:0;background:#11100f;z-index:5}
.viewer.active{display:flex;flex-direction:column}
.viewerbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #3a342d;background:#151311;flex-shrink:0}
.back{border:0;background:none;color:#f4efe5;font:14px Arial,sans-serif;padding:12px 8px}
.title{font:12px Arial,sans-serif;letter-spacing:2px;color:#c9b99a}
.pdf{width:100%;height:calc(100vh - 64px);border:0;background:#fff}
footer{text-align:center;color:#6f675e;font:10px Arial,sans-serif;letter-spacing:1px;margin-top:35px}
</style>
</head>
<body>
<header>
  <div class="brand">TIZNELIA</div>
  <div class="by">BY BUCA</div>
  <div class="tag">EL ARTE DE LA BRASA</div>
</header>
<main>
  <h1>NUESTRA CARTA</h1>
  <div class="buttons">
    <a class="button" href="#" onclick="openMenu('alimentos.pdf','ALIMENTOS');return false">ALIMENTOS</a>
    <a class="button" href="#" onclick="openMenu('bebidas.pdf','BEBIDAS');return false">BEBIDAS</a>
    <a class="button" href="#" onclick="alert('La sección de VINOS estará disponible próximamente.');return false">VINOS</a>
  </div>
  <div class="note">Consulta nuestra carta desde tu celular.</div>
  <footer>© TIZNELIA BY BUCA</footer>
</main>

<div id="viewer" class="viewer">
  <div class="viewerbar">
    <button class="back" onclick="closeMenu()">← Carta</button>
    <div id="viewerTitle" class="title"></div>
    <div style="width:62px"></div>
  </div>
  <iframe id="pdf" class="pdf" title="Carta digital"></iframe>
</div>

<script>
function openMenu(file,title){
  document.getElementById('viewerTitle').textContent=title;
  document.getElementById('pdf').src=file;
  document.getElementById('viewer').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeMenu(){
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('pdf').src='';
  document.body.style.overflow='';
}
</script>
</body>
</html>
